<script>
const cadres = [...document.querySelectorAll("iframe")];
const bilan = document.getElementById("bilan");
async function charger() {
  for (let i = 0; i < cadres.length; i += 6) {
    const vague = cadres.slice(i, i + 6);
    await Promise.all(vague.map(f => new Promise(r => {
      f.addEventListener("load", () => setTimeout(r, 1500), { once: true });
      f.src = f.dataset.src;
      setTimeout(r, 15000);
    })));
    bilan.textContent = "charge " + Math.min(i + 6, cadres.length) + "/" + cadres.length + "...";
  }
  mesurer();
}
function mesurer() {
  const mauvais = [];
  for (const f of cadres) {
    let w = 0;
    try { w = f.contentDocument.documentElement.scrollWidth; } catch (e) { w = -1; }
    if (w > 390) { f.classList.add("deborde"); mauvais.push(f.dataset.src + " -> " + w + "px"); }
  }
  window.__bilan = mauvais;
  bilan.textContent = mauvais.length === 0
    ? "OK - aucun debordement sur " + cadres.length + " ecrans a 390px"
    : "DEBORDEMENT sur " + mauvais.length + "/" + cadres.length + " :
" + mauvais.join("
");
}
charger();
</script>
